<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="ラフル, solo founder, building TiME in Tokyo">
  <title>ラフル</title>
  <desc>Solo founder. Building TiME. Tokyo.</desc>

  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0%"   stop-color="#0E1A14"/>
      <stop offset="55%"  stop-color="#0A0F0C"/>
      <stop offset="100%" stop-color="#05080A"/>
    </radialGradient>

    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#39D353" stop-opacity="0.18"/>
      <stop offset="45%"  stop-color="#26A641" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#26A641" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#A6FFB8"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#39D353"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#39D353" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#39D353" stop-opacity="0.7"/>
      <stop offset="75%"  stop-color="#39D353" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#39D353" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dataPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#39D353" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#A6FFB8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#39D353" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <filter id="nameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="1280" height="380" fill="url(#bg)"/>

  <!-- Central glow halo behind the name -->
  <ellipse cx="640" cy="190" rx="560" ry="180" fill="url(#centerGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/>
  </ellipse>

  <!-- ============================================================== -->
  <!-- THE NETWORK                                                     -->
  <!-- 14 nodes scattered like a constellation. Each pulses on its own  -->
  <!-- offset cycle. Lines connect nearby nodes; each line draws in,    -->
  <!-- holds, fades out, repeats, with stagger so the network feels    -->
  <!-- alive and never static.                                          -->
  <!-- ============================================================== -->

  <g stroke-linecap="round">

    <!-- Connection lines, animated stroke-dashoffset reveal-then-fade -->
    <!-- pathLength="100" normalizes the dash math regardless of actual length -->

    <line x1="160" y1="80"  x2="260" y2="150" stroke="#39D353" stroke-width="0.6" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="6s" begin="0s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.35;0.65;1"
               dur="6s" begin="0s" repeatCount="indefinite"/>
    </line>

    <line x1="260" y1="150" x2="380" y2="90"  stroke="#39D353" stroke-width="0.6" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="6.5s" begin="1.2s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.35;0.65;1"
               dur="6.5s" begin="1.2s" repeatCount="indefinite"/>
    </line>

    <line x1="380" y1="90"  x2="520" y2="170" stroke="#39D353" stroke-width="0.6" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="7.2s" begin="2.4s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.35;0.65;1"
               dur="7.2s" begin="2.4s" repeatCount="indefinite"/>
    </line>

    <line x1="160" y1="280" x2="280" y2="320" stroke="#39D353" stroke-width="0.6" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="5.8s" begin="0.6s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.35;0.65;1"
               dur="5.8s" begin="0.6s" repeatCount="indefinite"/>
    </line>

    <line x1="280" y1="320" x2="440" y2="280" stroke="#39D353" stroke-width="0.6" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="6.8s" begin="3.1s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.35;0.65;1"
               dur="6.8s" begin="3.1s" repeatCount="indefinite"/>
    </line>

    <line x1="760" y1="170" x2="900" y2="90"  stroke="#39D353" stroke-width="0.6" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="7s" begin="1.9s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.35;0.65;1"
               dur="7s" begin="1.9s" repeatCount="indefinite"/>
    </line>

    <line x1="900" y1="90"  x2="1020" y2="150" stroke="#39D353" stroke-width="0.6" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="6.4s" begin="0.4s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.35;0.65;1"
               dur="6.4s" begin="0.4s" repeatCount="indefinite"/>
    </line>

    <line x1="1020" y1="150" x2="1120" y2="80" stroke="#39D353" stroke-width="0.6" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="7.5s" begin="2.8s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.35;0.65;1"
               dur="7.5s" begin="2.8s" repeatCount="indefinite"/>
    </line>

    <line x1="840" y1="280" x2="980" y2="320" stroke="#39D353" stroke-width="0.6" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="6.2s" begin="1.5s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.35;0.65;1"
               dur="6.2s" begin="1.5s" repeatCount="indefinite"/>
    </line>

    <line x1="980" y1="320" x2="1110" y2="280" stroke="#39D353" stroke-width="0.6" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="5.6s" begin="3.4s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.35;0.65;1"
               dur="5.6s" begin="3.4s" repeatCount="indefinite"/>
    </line>

    <line x1="520" y1="170" x2="640" y2="80"  stroke="#39D353" stroke-width="0.5" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="8s" begin="4s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.35;0.65;1"
               dur="8s" begin="4s" repeatCount="indefinite"/>
    </line>

    <line x1="640" y1="80" x2="760" y2="170"  stroke="#39D353" stroke-width="0.5" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="7.8s" begin="5.2s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.35;0.65;1"
               dur="7.8s" begin="5.2s" repeatCount="indefinite"/>
    </line>

    <line x1="440" y1="280" x2="640" y2="310"  stroke="#39D353" stroke-width="0.5" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="7.4s" begin="2.2s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.35;0.65;1"
               dur="7.4s" begin="2.2s" repeatCount="indefinite"/>
    </line>

    <line x1="640" y1="310" x2="840" y2="280"  stroke="#39D353" stroke-width="0.5" pathLength="100"
          stroke-dasharray="100" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;0.35;0.65;1"
               dur="6.6s" begin="4.5s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1"/>
      <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.35;0.65;1"
               dur="6.6s" begin="4.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Node dots: each pulses on its own offset cycle -->
  <g fill="#39D353" filter="url(#softGlow)">
    <circle cx="160"  cy="80"  r="2.2"><animate attributeName="r" values="1.8;3;1.8" dur="4.2s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="260"  cy="150" r="2.5"><animate attributeName="r" values="2;3.4;2" dur="3.8s" begin="0.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="380"  cy="90"  r="2"  ><animate attributeName="r" values="1.6;2.8;1.6" dur="4.6s" begin="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="520"  cy="170" r="2.2"><animate attributeName="r" values="1.8;3;1.8" dur="5.1s" begin="2.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="640"  cy="80"  r="1.8"><animate attributeName="r" values="1.4;2.5;1.4" dur="4.4s" begin="2.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="760"  cy="170" r="2.2"><animate attributeName="r" values="1.8;3;1.8" dur="4s" begin="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="900"  cy="90"  r="2.5"><animate attributeName="r" values="2;3.4;2" dur="4.8s" begin="0.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="1020" cy="150" r="2"  ><animate attributeName="r" values="1.6;2.8;1.6" dur="3.6s" begin="1.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="1120" cy="80"  r="2.2"><animate attributeName="r" values="1.8;3;1.8" dur="4.4s" begin="1.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>

    <circle cx="160"  cy="280" r="2.2"><animate attributeName="r" values="1.8;3;1.8" dur="5s" begin="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="280"  cy="320" r="2"  ><animate attributeName="r" values="1.6;2.8;1.6" dur="4.2s" begin="3.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="440"  cy="280" r="2.5"><animate attributeName="r" values="2;3.4;2" dur="3.7s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="640"  cy="310" r="2.2"><animate attributeName="r" values="1.8;3.4;1.8" dur="4.4s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="840"  cy="280" r="2.5"><animate attributeName="r" values="2;3.4;2" dur="4.6s" begin="1.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="980"  cy="320" r="2"  ><animate attributeName="r" values="1.6;2.8;1.6" dur="3.9s" begin="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
    <circle cx="1110" cy="280" r="2.2"><animate attributeName="r" values="1.8;3;1.8" dur="4.8s" begin="3.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/></circle>
  </g>

  <!-- ============================================================== -->
  <!-- THE NAME: "ラフル"                                              -->
  <!-- Liquid mask reveal (sweep from left to right, soft edge),       -->
  <!-- then continuous gentle scale-breath + subtle glow pulse.        -->
  <!-- ============================================================== -->

  <defs>
    <linearGradient id="nameMaskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <mask id="nameReveal" maskUnits="userSpaceOnUse" x="380" y="120" width="520" height="160">
      <rect x="380" y="120" width="0" height="160" fill="#FFFFFF">
        <animate attributeName="width" from="0" to="540"
                 begin="0.4s" dur="1.6s" fill="freeze"
                 calcMode="spline" keySplines="0.65 0 0.35 1"/>
      </rect>
      <rect x="240" y="120" width="160" height="160" fill="url(#nameMaskGrad)">
        <animate attributeName="x" from="240" to="780"
                 begin="0.4s" dur="1.6s" fill="freeze"
                 calcMode="spline" keySplines="0.65 0 0.35 1"/>
      </rect>
    </mask>
  </defs>

  <!-- Dim baseline ラフル, always present at low luminance -->
  <text x="640" y="220" text-anchor="middle"
        font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', '游ゴシック', sans-serif"
        font-size="130" font-weight="300" fill="#FAF8F3" opacity="0.10" letter-spacing="0.04em">ラフル</text>

  <!-- Bright revealed ラフル -->
  <g mask="url(#nameReveal)">
    <text x="640" y="220" text-anchor="middle"
          font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', '游ゴシック', sans-serif"
          font-size="130" font-weight="300" fill="url(#nameGradient)" letter-spacing="0.04em"
          filter="url(#nameGlow)">
      ラフル
      <animateTransform attributeName="transform" type="scale"
                        values="1;1.012;1" dur="6s" begin="2.5s" repeatCount="indefinite"
                        additive="sum"
                        calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/>
    </text>
  </g>

  <!-- Romaji subtitle, fades in after the kanji reveal -->
  <text x="640" y="252" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="11" fill="#39D353" letter-spacing="0.45em" opacity="0">
    R  A  H  U  L
    <animate attributeName="opacity" from="0" to="0.75"
             begin="2.0s" dur="1.0s" fill="freeze"/>
  </text>

  <!-- Animated accent line below name -->
  <line x1="540" y1="278" x2="740" y2="278" stroke="url(#accentLine)" stroke-width="1.2" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.8s" fill="freeze"/>
  </line>

  <!-- Data pulse traveling along that accent line, repeating -->
  <rect x="540" y="277" width="60" height="2.4" fill="url(#dataPulse)" opacity="0.9" rx="1">
    <animate attributeName="x" from="540" to="680" begin="3.5s" dur="2.4s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.65 0 0.35 1"/>
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" begin="3.5s" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline below -->
  <text x="640" y="310" text-anchor="middle"
        font-family="ui-sans-serif, 'Inter', 'Helvetica Neue', system-ui"
        font-size="15" font-weight="300" fill="#C9D1D9" letter-spacing="0.04em" opacity="0">
    solo founder · building TiME · Tokyo
    <animate attributeName="opacity" from="0" to="0.95" begin="2.4s" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Top-left identifier -->
  <text x="80" y="28" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="10" fill="#39D353" letter-spacing="0.22em" opacity="0.65">
    NODE.WATARIKAI96
  </text>

  <!-- Top-right status -->
  <text x="1200" y="28" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="10" fill="#39D353" letter-spacing="0.22em" text-anchor="end" opacity="0.65">
    LIVE · TOKYO
  </text>
  <circle cx="1212" cy="24" r="2.5" fill="#39D353" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1"/>
  </circle>

  <!-- Bottom-left stack identifier -->
  <text x="80" y="362" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="10" fill="#26A641" letter-spacing="0.22em" opacity="0.6">
    KOTLIN · SWIFTUI · RAILS · AWS
  </text>

  <!-- Bottom-right phase line -->
  <text x="1200" y="362" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="10" fill="#26A641" letter-spacing="0.22em" text-anchor="end" opacity="0.6">
    PHASE A · WEEK 1
  </text>

</svg>
